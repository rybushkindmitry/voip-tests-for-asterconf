# Инвентарь окружения prod — схема (локально не исполняется, как vars/prod_vars.yml).
# SBC-пара: деплой по одной ноде (serial: 1, ручные джобы-«кнопки» в CI).
# Site-плейбук (деплой+тесты) против prod не играется: конфиг тестируется
# на окружении test до выката, поэтому группы test_node здесь нет.
[gateway]
sbc-prod-01 ansible_host=192.0.2.31 ansible_user=deploy
sbc-prod-02 ansible_host=192.0.2.32 ansible_user=deploy
