# Инвентарь окружения stage — схема (локально не исполняется, как vars/stage_vars.yml).
# Только цель выката: конфиг тестируется на окружении test до деплоя
# (гейт в CI: needs: [test]).
# SBC-пара, как в prod; выкат по одной ноде (serial: 1), по кнопке.
# В продовом репозитории здесь SSH-хосты нод окружения.
[gateway]
sbc-stage-01 ansible_host=192.0.2.21 ansible_user=deploy
sbc-stage-02 ansible_host=192.0.2.22 ansible_user=deploy
