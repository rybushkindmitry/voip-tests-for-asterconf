# Инвентарь окружения dev — схема (локально не исполняется, как vars/dev_vars.yml).
# Только цель выката: конфиг тестируется на окружении test до деплоя
# (гейт в CI: needs: [test]).
# SBC-пара, как в prod; выкат по одной ноде (serial: 1).
# В продовом репозитории здесь SSH-хосты нод окружения; gateway и rtpengine
# совмещены на одной ноде (host-режим, один IP).
[gateway]
sbc-dev-01 ansible_host=192.0.2.11 ansible_user=deploy
sbc-dev-02 ansible_host=192.0.2.12 ansible_user=deploy
