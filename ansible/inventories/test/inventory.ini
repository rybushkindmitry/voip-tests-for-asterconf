# Инвентарь окружения test (по умолчанию): ansible работает локально внутри CI-джобы.
# Выбирается переменной ENV из пайплайна: -i ansible/inventories/$ENV/inventory.ini
#
# В продовом репозитории здесь SSH-хосты тестового стенда, например:
#   [test_node]
#   sbc-test-node01 ansible_host=10.0.0.50 ansible_user=deploy
[test_node]
localhost ansible_connection=local
